name: Run Economic Data Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -V
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install requests pandas openpyxl fredapi

      - name: Show installed packages (diagnostic)
        run: |
          python -V
          python -m pip show fredapi || echo "fredapi not found"
          python -m pip list | sed -n '1,200p'

      - name: Show repo files (diagnostic)
        run: ls -la && echo "pwd: $(pwd)" && find . -maxdepth 2 -type f -print

      - name: Run updater script
        # If your script needs a FRED key, make sure you set it in repo Secrets and pass it below
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "FRED_API_KEY is set? ->" && [ -z "${FRED_API_KEY}" ] && echo "EMPTY" || echo "SET"
          python update_economic_data.py
